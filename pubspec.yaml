name: fertiflow
description: "Intelligent Precision Irrigation & Fertigation System"
publish_to: 'none'
version: 2.4.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  percent_indicator: ^4.2.3
  image_picker: ^1.2.3
  sqflite: ^2.3.3 
  path: ^1.9.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_database: ^11.3.10
  cloud_firestore: ^5.0.0
  google_sign_in: ^6.2.2
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  geolocator: ^14.0.3
  http: ^1.6.0
  tflite_flutter: ^0.12.1
  image: ^4.3.0
  google_generative_ai: ^0.4.7
  url_launcher: ^6.3.3
  flutter_linkify: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/models/
